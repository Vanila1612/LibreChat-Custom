services:
  api:
    container_name: LibreChat
    image: librechat-agribank:local
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    depends_on:
      - mongodb
      - rag_api
      - meilisearch
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      JWT_SECRET: 6453107bc399cfaed4a50977b8a36ef2a92dc03191c515c4ca2c63a4c10d1132
      JWT_REFRESH_SECRET: 40e11aa7cdf017e81f6cd9100219e7bd00c7c2ac95ad194302d918591eb39548
      CREDS_KEY: f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      CREDS_IV: e2341419ec3dd3d19b13a1a87fafcbfb
    restart: unless-stopped

  mongodb:
    container_name: chat-mongodb
    image: mongo:8.0.20
    command: mongod --noauth
    restart: unless-stopped
    volumes:
      - librechat_mongodb_data:/data/db

  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - librechat_meili_data:/meili_data

  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - librechat_pgdata:/var/lib/postgresql/data

  rag_api:
    container_name: rag_api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    depends_on:
      - vectordb
    env_file:
      - .env
    environment:
      DB_HOST: vectordb
      RAG_PORT: ${RAG_PORT:-8000}
    restart: unless-stopped

volumes:
  librechat_mongodb_data:
  librechat_meili_data:
  librechat_pgdata:
